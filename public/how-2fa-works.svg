<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 572"
  width="1024"
  height="572"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">How 2FA Authentication works</title>
  <desc id="desc">
    A shared secret key and the current time are combined inside a TOTP engine that
    produces a six digit code, which is submitted together with the password to a service.
  </desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151C2C" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A344A" />
    </marker>
  </defs>

  <rect width="1024" height="572" rx="24" fill="#080B14" />

  <!-- Title -->
  <text x="512" y="62" text-anchor="middle" font-family="'Space Grotesk', Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#E2E8F0">
    How two-factor authentication produces a login code
  </text>
  <rect x="452" y="84" width="120" height="4" rx="2" fill="url(#accent)" />

  <!-- 1. Your device -->
  <g>
    <rect x="48" y="140" width="212" height="300" rx="18" fill="url(#panel)" stroke="#2A344A" stroke-width="2" />
    <rect x="48" y="140" width="212" height="46" rx="18" fill="#1B2436" />
    <rect x="48" y="168" width="212" height="18" fill="#1B2436" />
    <text x="154" y="170" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600" fill="#00F0FF">
      Your device
    </text>

    <text x="72" y="228" font-family="'JetBrains Mono', monospace" font-size="16" fill="#94A3B8">password</text>
    <rect x="72" y="240" width="164" height="34" rx="8" fill="#05080F" stroke="#2A344A" />
    <text x="84" y="263" font-family="'JetBrains Mono', monospace" font-size="15" fill="#64748B">••••••••</text>

    <text x="72" y="308" font-family="'JetBrains Mono', monospace" font-size="16" fill="#94A3B8">secret key</text>
    <rect x="72" y="320" width="164" height="34" rx="8" fill="#05080F" stroke="#00F0FF" stroke-opacity="0.5" />
    <text x="84" y="343" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E2E8F0">JBSW•••3PXP</text>

    <text x="72" y="396" font-family="'JetBrains Mono', monospace" font-size="16" fill="#94A3B8">device clock</text>
    <rect x="72" y="408" width="164" height="1" fill="#2A344A" />
    <text x="84" y="424" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00F0FF">T = 10:42:05</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 268 290 L 316 290" stroke="#2A344A" stroke-width="3" marker-end="url(#arrow)" />

  <!-- 2. TOTP engine -->
  <g>
    <rect x="326" y="140" width="300" height="300" rx="18" fill="url(#panel)" stroke="#7000FF" stroke-opacity="0.55" stroke-width="2" />
    <rect x="326" y="140" width="300" height="46" rx="18" fill="#1B2436" />
    <rect x="326" y="168" width="300" height="18" fill="#1B2436" />
    <text x="476" y="170" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600" fill="#A78BFA">
      TOTP engine
    </text>

    <rect x="362" y="218" width="228" height="52" rx="10" fill="#05080F" stroke="#2A344A" />
    <text x="476" y="241" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B">counter =</text>
    <text x="476" y="262" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#00F0FF">floor(T / 30)</text>

    <rect x="362" y="286" width="228" height="52" rx="10" fill="#05080F" stroke="#2A344A" />
    <text x="476" y="309" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B">hash =</text>
    <text x="476" y="330" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#00F0FF">HMAC-SHA1(secret, c)</text>

    <rect x="362" y="354" width="228" height="52" rx="10" fill="#05080F" stroke="#2A344A" />
    <text x="476" y="377" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B">truncate =</text>
    <text x="476" y="398" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#00F0FF">mod 1 000 000</text>

    <text x="476" y="428" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#64748B">runs entirely in your browser</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 636 290 L 684 290" stroke="#2A344A" stroke-width="3" marker-end="url(#arrow)" />

  <!-- 3. The code -->
  <g>
    <rect x="694" y="216" width="282" height="148" rx="18" fill="url(#panel)" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="2" />
    <text x="835" y="252" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#94A3B8">
      One-time code
    </text>
    <text x="835" y="322" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="700" letter-spacing="6" fill="url(#codeGrad)">
      283 104
    </text>
    <text x="835" y="350" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B">
      valid for 30 seconds
    </text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 835 374 L 835 414" stroke="#2A344A" stroke-width="3" marker-end="url(#arrow)" />

  <!-- 4. The service -->
  <g>
    <rect x="694" y="424" width="282" height="88" rx="18" fill="url(#panel)" stroke="#2A344A" stroke-width="2" />
    <text x="835" y="462" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="600" fill="#E2E8F0">
      The service
    </text>
    <text x="835" y="488" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">
      password + code
    </text>
  </g>

  <!-- Secret never leaves -->
  <g>
    <rect x="48" y="470" width="578" height="42" rx="12" fill="#0F1524" stroke="#2A344A" stroke-width="1.5" />
    <circle cx="76" cy="491" r="9" fill="none" stroke="#00F0FF" stroke-width="2" />
    <path d="M 72 491 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#00F0FF" stroke-width="2" />
    <rect x="71" y="490" width="10" height="8" rx="2" fill="#00F0FF" />
    <text x="98" y="497" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#94A3B8">
      Your secret key never leaves this device — the code is derived locally.
    </text>
  </g>
</svg>
